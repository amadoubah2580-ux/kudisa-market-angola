<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kudisa Market Angola</title>

  <style>

    body { font-family: Arial, sans-serif; margin: 0; background: #f3f5f4; color: #222; }

    header { background: #087443; color: white; padding: 24px 12px; text-align: center; }

    main { padding: 20px; max-width: 800px; margin: auto; }

    .categories { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .item { background: white; padding: 20px 8px; text-align: center; border-radius: 10px; box-shadow: 0 2px 5px #ddd; }

    .emoji { font-size: 30px; }

  </style>

</head>

<body>

  <header>

    <h1>Kudisa Market</h1>

    <p>Achetez et vendez facilement en Angola</p>

  </header>

  <main>

    <h2>Nos catégories</h2>

    <div class="categories">

      <div class="item"><div class="emoji">🥬</div><p>Alimentation</p></div>

      <div class="item"><div class="emoji">🧱</div><p>Construction</p></div>

      <div class="item"><div class="emoji">📱</div><p>Téléphones</p></div>

      <div class="item"><div class="emoji">👕</div><p>Vêtements</p></div>

      <div class="item"><div class="emoji">🪑</div><p>Maison</p></div>

      <div class="item"><div class="emoji">📦</div><p>Autres produits</p></div>

    </div>

  </main>

  <footer style="text-align:center;padding:20px">

    Kudisa Market Angola © 2026

  </footer>

</body>

</html>
